name: Build DJooN Mixer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DJooN Mixer.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="DJooN Mixer.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "File 'DJooN Mixer.zip' tidak ditemukan di root repository. Unggah ZIP proyek dengan nama persis tersebut."
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f "source/DJooN Mixer/package.json"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/DJooN Mixer" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run android:init

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run apk:debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJooN-Mixer-debug-APK
          path: source/DJooN Mixer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
